<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b100f">
  <title>تدبر القرآن</title>
  <style>
    :root{
      --bg:#0b100f;
      --panel:#151d19;
      --gold:#d8b66b;
      --ink:#f2ead6;
      --muted:#b7b8af;
      --line:#3a453d;
      --accent:#1b4739;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
    body{display:flex;justify-content:center}
    .app{
      width:min(100%,1100px);
      min-height:100vh;
      background:linear-gradient(180deg,#0f1715,#0b100f);
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
    }
    header{
      display:flex;align-items:center;gap:14px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(135deg,#102a1f,#101a15);
      position:sticky;top:0;z-index:10;
    }
    .logo{
      width:52px;height:52px;border-radius:14px;overflow:hidden;
      border:2px solid var(--gold);background:#000;flex-shrink:0;
    }
    .logo img{display:block;width:100%;height:100%;object-fit:cover}
    .title-wrap{display:flex;flex-direction:column;justify-content:center}
    .title{
      font-size:18px;font-weight:700;color:var(--gold)
    }
    .subtitle{
      color:var(--muted);font-size:12px
    }
    main{
      padding:14px 16px 28px;
    }
    .controls{
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px
    }
    select,button{
      border:1px solid var(--line);
      background:#1f2a25;color:var(--ink);
      border-radius:10px;padding:10px 12px;
      font:inherit
    }
    select{flex:1;min-width:140px}
    button{
      background:var(--accent);border-color:#2b624f;
      cursor:pointer;font-weight:600
    }
    #status{
      text-align:center;
      color:var(--gold);
      min-height:24px;
      margin:8px 0 14px;
      font-size:14px;
    }
    .verse{
      background:rgba(255,255,255,0.02);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
    }
    .meta{
      display:flex;justify-content:space-between;align-items:center;
      color:var(--gold);font-size:12px;margin-bottom:10px;
    }
    .arabic{
      font-family:"Amiri Quran","Tahoma",serif;
      font-size:34px;
      line-height:2.1;
      direction:rtl;
      color:#fff4dc;
      text-align:justify;
      margin:0 0 12px;
      word-break:break-word;
    }
    .translation{
      margin:0;
      color:#eae6dc;
      line-height:2;
      font-size:16px;
    }
    .empty{
      text-align:center;color:var(--muted);padding:24px 8px;
    }
    @media (min-width:700px){
      .verse{padding:18px}
      .arabic{font-size:40px}
      .translation{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <img src="./icon-512.png" alt="لوگوی تدبر القرآن">
      </div>
      <div class="title-wrap">
        <div class="title">تدبّر القرآن</div>
        <div class="subtitle">قراءة و تلاوت ساده</div>
      </div>
    </header>

    <main>
      <div class="controls">
        <select id="surah"></select>
        <button id="playBtn">پخش آیه</button>
      </div>
      <div id="status">در حال آماده‌سازی…</div>
      <div id="verses"></div>
    </main>
  </div>

  <script>
    const API = "https://api.alquran.cloud/v1";
    const $ = (id) => document.getElementById(id);
    let surahs = [];
    let verses = [];
    let currentAudio = null;

    function setStatus(msg) {
      $("status").textContent = msg;
    }

    async function api(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error("ارتباط ناموفق");
      const json = await res.json();
      if (json.code !== 200) throw new Error(json.status || "خطای API");
      return json.data;
    }

    function renderVerse(v) {
      const box = document.createElement("article");
      box.className = "verse";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span>سوره ${v.surah}</span><span>آیه ${v.ayah}</span>`;

      const arabic = document.createElement("p");
      arabic.className = "arabic";
      arabic.textContent = v.arabic;

      const translation = document.createElement("p");
      translation.className = "translation";
      translation.textContent = v.translation || "ترجمه‌ای موجود نیست.";

      box.append(meta, arabic, translation);
      return box;
    }

    async function loadSurah(n) {
      setStatus("در حال بارگذاری...");
      try {
        const data = await api("/surah/" + n);
        const list = data.ayahs || [];
        verses = list.map(a => ({
          surah: n,
          ayah: a.numberInSurah,
          arabic: a.text,
          translation: a.translation || ""
        }));
        const box = $("verses");
        box.innerHTML = "";
        if (!verses.length) {
          box.innerHTML = '<div class="empty">آیه‌ای پیدا نشد.</div>';
          return;
        }
        verses.forEach(v => box.appendChild(renderVerse(v)));
        setStatus("سوره آماده شد");
      } catch (e) {
        $("verses").innerHTML = '<div class="empty">دریافت داده ممکن نشد.</div>';
        setStatus("خطا در اتصال");
      }
    }

    async function initSurahs() {
      try {
        const data = await api("/surah");
        surahs = data;
        const select = $("surah");
        select.innerHTML = "";
        data.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.number;
          opt.textContent = `${s.number}. ${s.name}`;
          select.appendChild(opt);
        });
        select.value = "1";
        await loadSurah(1);
      } catch {
        setStatus("فهرست سوره‌ها در دسترس نیست");
      }
    }

    async function playCurrentAyah() {
      const surah = Number($("surah").value);
      if (!verses.length) return;

      const audio = new Audio();
      currentAudio && currentAudio.pause();

      const ayah = verses[0];
      try {
        const data = await api("/ayah/" + (surah * 1000 + ayah.ayah) + "/ar.alafasy");
        if (data && data.audio) {
          currentAudio = audio;
          audio.src = data.audio;
          audio.play();
          setStatus("در حال پخش آیه...");
        } else {
          setStatus("فایل صوتی در دسترس نیست");
        }
      } catch {
        setStatus("پخش آیه ممکن نشد");
      }
    }

    $("surah").onchange = () => {
      loadSurah(Number($("surah").value));
    };

    $("playBtn").onclick = playCurrentAyah;

    initSurahs();
  </script>
</body>
</html>
