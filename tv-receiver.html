<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09251c">
<title>تدبر القرآن · تلویزیون</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
@font-face{font-family:"UthmanicHafs";src:url("https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2") format("woff2");font-display:swap}
@import url("https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap");
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;background:#07130d url("./hero-quran.png") center/cover no-repeat fixed;color:#fff1d4;font-family:Tahoma,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(110deg,rgba(3,13,8,.38),rgba(3,13,8,.76) 55%,rgba(3,13,8,.56));pointer-events:none}
.frame{position:relative;z-index:1;width:min(94vw,1680px);height:min(94vh,980px);display:flex;flex-direction:column;align-items:stretch;gap:clamp(12px,2vh,24px);padding:clamp(18px,3vh,38px) clamp(20px,3.5vw,58px);border:1px solid rgba(220,190,120,.72);border-radius:30px;background:linear-gradient(135deg,rgba(5,27,16,.82),rgba(7,20,13,.76));box-shadow:0 18px 70px #0009,inset 0 0 0 5px rgba(214,177,94,.07)}
.frame:before{content:"";position:absolute;inset:10px;border:1px solid rgba(220,190,120,.26);border-radius:22px;pointer-events:none}
.brand{display:flex;align-items:center;justify-content:center;gap:20px;text-align:center;flex:0 0 auto}
.brand img{width:clamp(52px,5vw,78px);height:clamp(52px,5vw,78px);object-fit:contain;border:1px solid #d8b66b;border-radius:20px;background:#08150e}
h1{margin:0;color:#f2d58d;font-size:clamp(26px,3vw,48px);text-shadow:0 2px 12px #000}
.sub{margin:5px 0 0;color:#e7ddc7;font-size:clamp(12px,1.2vw,18px)}
.now{font-size:clamp(18px,2vw,30px);color:#f0d58e;text-align:center}
.reciter{font-size:clamp(14px,1.4vw,21px);color:#e5dfcf;text-align:center}
.basmala{font-family:"UthmanicHafs","Amiri Quran",serif;font-size:clamp(30px,4.2vw,64px);line-height:1.8;color:#edcf84;text-align:center;text-shadow:0 3px 16px #000;margin:0}
.ayah-scroll{flex:1 1 auto;min-height:0;width:100%;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.5vh,18px);padding:8px clamp(8px,2vw,28px);scrollbar-width:thin;scrollbar-color:#b99a5a transparent}
.tv-ayah{font-family:"UthmanicHafs","Amiri Quran",serif;font-size:clamp(26px,3.25vw,50px);line-height:2.05;text-align:center;color:#fff3d8;text-shadow:0 2px 12px #000;padding:0 0 10px;border-bottom:1px solid rgba(210,177,99,.22)}
.tv-ayah:last-child{border-bottom:0}
.ayah-number{font-family:Tahoma,Arial,sans-serif;font-size:.38em;color:#e3c274;border:1px solid rgba(220,190,120,.7);border-radius:50%;display:inline-grid;place-items:center;width:2.1em;height:2.1em;vertical-align:middle;margin:0 .35em;direction:ltr}
.hint{font-size:clamp(11px,1vw,15px);color:#c3c8ba;text-align:center;flex:0 0 auto}
cast-media-player{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none;left:-10px;bottom:-10px}
@media(max-width:700px){.frame{height:96vh;width:96vw;padding:16px;border-radius:18px}.brand{gap:10px}.tv-ayah{font-size:clamp(24px,5vw,34px)}}
</style>
</head>
<body>
<main class="frame">
  <header class="brand">
    <img src="./icon-512.png" alt="نشان تدبر القرآن">
    <div><h1>تَدَبُّرُ القُرآن</h1><p class="sub">قرآن کریم · تلاوت زنده با رسم‌الخط عثمانی حفص</p></div>
  </header>
  <div id="tvSurah" class="now">در انتظار اتصال دستگاه فرستنده…</div>
  <div id="tvReciter" class="reciter">سه قاری برگزیدهٔ تدبر القرآن</div>
  <div id="tvBasmala" class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <section id="tvAyahs" class="ayah-scroll" aria-live="polite">
    <div class="tv-ayah">برای آغاز تلاوت، از موبایل یا آیپد به تلویزیون وصل شو.</div>
  </section>
  <footer class="hint" id="tvHint">صدای تلاوت از تلویزیون پخش می‌شود · کنترل از موبایل یا ریموت تلویزیون</footer>
</main>
<cast-media-player></cast-media-player>
<script>
(function(){
  "use strict";
  if(!window.cast || !cast.framework) return;
  const context=cast.framework.CastReceiverContext.getInstance();
  const player=context.getPlayerManager();
  const surah=document.getElementById("tvSurah");
  const reciter=document.getElementById("tvReciter");
  const hint=document.getElementById("tvHint");
  const ayahBox=document.getElementById("tvAyahs");
  const basmala=document.getElementById("tvBasmala");
  const names={
    "ar.alafasy":"استاد مشاری بن راشد العفاسی",
    "ar.abdulbasit":"استاد عبدالباسط عبدالصمد",
    "ar.husary":"استاد محمود خلیل الحصری"
  };
  let requestId=0;
  function renderAyahs(ayahs){
    ayahBox.replaceChildren();
    ayahs.forEach(ayah=>{
      const line=document.createElement("div");
      line.className="tv-ayah";
      line.textContent=ayah.text || "";
      const number=document.createElement("span");
      number.className="ayah-number";
      number.textContent=String(ayah.numberInSurah || "");
      line.appendChild(document.createTextNode(" "));
      line.appendChild(number);
      ayahBox.appendChild(line);
    });
  }
  async function loadUthmaniText(surahNumber){
    const thisRequest=++requestId;
    ayahBox.innerHTML='<div class="tv-ayah">در حال آماده‌سازی متن قرآن با رسم‌الخط عثمانی…</div>';
    try{
      const response=await fetch("https://api.alquran.cloud/v1/surah/"+surahNumber+"/quran-uthmani");
      if(!response.ok) throw new Error("Quran text service unavailable");
      const result=await response.json();
      const ayahs=result && result.data && Array.isArray(result.data.ayahs)?result.data.ayahs:[];
      if(!ayahs.length) throw new Error("No ayahs returned");
      if(thisRequest!==requestId) return;
      renderAyahs(ayahs);
      ayahBox.scrollTop=0;
      hint.textContent="متن قرآن با خط عثمانی حفص · تلاوت از تلویزیون پخش می‌شود";
    }catch(error){
      if(thisRequest!==requestId) return;
      ayahBox.innerHTML='<div class="tv-ayah">متن عثمانی در حال حاضر دریافت نشد؛ اتصال اینترنت تلویزیون را بررسی کن.</div>';
    }
  }
  player.setMessageInterceptor(cast.framework.messages.MessageType.LOAD,request=>{
    const metadata=request.media && request.media.metadata ? request.media.metadata : {};
    const custom=request.media && request.media.customData ? request.media.customData : {};
    const number=Number(custom.surahNumber)||1;
    surah.textContent=custom.surahName || metadata.title || "تلاوت قرآن کریم";
    reciter.textContent=custom.reciterName || metadata.artist || names[custom.reciter] || "قاری تدبر القرآن";
    basmala.style.display=number===9?"none":"block";
    loadUthmaniText(number);
    hint.textContent="در حال اتصال تلاوت به تلویزیون…";
    return request;
  });
  player.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,()=>{
    hint.textContent="تلاوت آغاز شد · متن عثمانی روی صفحهٔ تلویزیون نمایش داده می‌شود";
  });
  player.addEventListener(cast.framework.events.EventType.ENDED,()=>{
    hint.textContent="این تلاوت پایان یافت · برای ادامه سورهٔ بعدی را انتخاب کن";
  });
  context.start();
})();
</script>>
</body>
</html>
